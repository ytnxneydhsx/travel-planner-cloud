spring.application.name=itinerary-service
spring.config.import=optional:classpath:common-web-logging.properties

# Server
server.port=8083

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_itinerary?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.type-aliases-package=org.example.itineraryservice.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Destination service
destination-service.base-url=${DESTINATION_SERVICE_BASE_URL:http://localhost:8081}
