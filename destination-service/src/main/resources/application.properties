spring.application.name=destination-service
spring.config.import=optional:classpath:common-web-logging.properties
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}

# Server
server.port=${SERVER_PORT:8081}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_destination?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.type-aliases-package=org.example.destinationservice.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dubbo
dubbo.application.name=${spring.application.name}
dubbo.application.qos-enable=false
dubbo.protocol.name=tri
dubbo.protocol.port=${DUBBO_PORT:50052}
dubbo.registry.address=nacos://${NACOS_SERVER_ADDR:127.0.0.1:8848}?username=${NACOS_USERNAME:nacos}&password=${NACOS_PASSWORD:nacos}
dubbo.registry.register-mode=instance

# Region dictionary
region.dictionary.location=classpath:regions/gb2260.json
