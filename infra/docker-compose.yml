name: nacos

services:
  loki:
    profiles:
      - observability
    image: grafana/loki:3.7.0
    container_name: travel-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./observability/data/loki:/loki
    restart: "no"

  alloy:
    profiles:
      - observability
    image: grafana/alloy:v1.16.0
    container_name: travel-alloy
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    ports:
      - "${ALLOY_HTTP_PORT:-12345}:12345"
    volumes:
      - ./observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - ./observability/data/alloy:/var/lib/alloy/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: "no"

  business-mysql:
    image: mysql:8.0.30
    container_name: travel-business-mysql
    env_file:
      - ./nacos/env/business-mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${BUSINESS_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./nacos/data/business-mysql:/var/lib/mysql
      - ./nacos/mysql-init/business:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: "no"

  nacos-mysql:
    image: mysql:8.0.30
    container_name: travel-nacos-mysql
    env_file:
      - ./nacos/env/nacos-mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${NACOS_MYSQL_PORT:-33060}:3306"
    volumes:
      - ./nacos/data/nacos-mysql:/var/lib/mysql
      - ./nacos/mysql-init/nacos:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: "no"

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: travel-nacos
    depends_on:
      nacos-mysql:
        condition: service_healthy
    env_file:
      - ./nacos/env/nacos.env
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - ./nacos/logs/nacos:/home/nacos/logs
    restart: "no"

  user-service:
    profiles:
      - microservices
    build:
      context: ..
      dockerfile: Dockerfile.spring-service
      args:
        SERVICE_MODULE: user-service
    container_name: travel-user-service
    env_file:
      - ./nacos/env/user-service.env
    depends_on:
      business-mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: "no"

  destination-service:
    profiles:
      - microservices
    build:
      context: ..
      dockerfile: Dockerfile.spring-service
      args:
        SERVICE_MODULE: destination-service
    container_name: travel-destination-service
    env_file:
      - ./nacos/env/destination-service.env
    depends_on:
      business-mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: "no"

  itinerary-service:
    profiles:
      - microservices
    build:
      context: ..
      dockerfile: Dockerfile.spring-service
      args:
        SERVICE_MODULE: itinerary-service
    container_name: travel-itinerary-service
    env_file:
      - ./nacos/env/itinerary-service.env
    depends_on:
      business-mysql:
        condition: service_healthy
      nacos:
        condition: service_started
    restart: "no"

  gateway-service:
    profiles:
      - microservices
    build:
      context: ..
      dockerfile: Dockerfile.spring-service
      args:
        SERVICE_MODULE: gateway-service
    container_name: travel-gateway-service
    env_file:
      - ./nacos/env/gateway-service.env
    depends_on:
      nacos:
        condition: service_started
      user-service:
        condition: service_started
      destination-service:
        condition: service_started
      itinerary-service:
        condition: service_started
    ports:
      - "${GATEWAY_SERVICE_PORT:-8080}:8080"
    restart: "no"
