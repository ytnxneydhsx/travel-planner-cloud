services:
  business-mysql:
    image: mysql:8.0.30
    container_name: travel-business-mysql
    env_file:
      - ./env/business-mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${BUSINESS_MYSQL_PORT:-3306}:3306"
    volumes:
      - ./data/business-mysql:/var/lib/mysql
      - ./mysql-init/business:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  nacos-mysql:
    image: mysql:8.0.30
    container_name: travel-nacos-mysql
    env_file:
      - ./env/nacos-mysql.env
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${NACOS_MYSQL_PORT:-33060}:3306"
    volumes:
      - ./data/nacos-mysql:/var/lib/mysql
      - ./mysql-init/nacos:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p123456"]
      interval: 5s
      timeout: 10s
      retries: 20
    restart: unless-stopped

  nacos:
    image: nacos/nacos-server:${NACOS_VERSION}
    container_name: travel-nacos
    depends_on:
      nacos-mysql:
        condition: service_healthy
    env_file:
      - ./env/nacos.env
    ports:
      - "${NACOS_CONSOLE_PORT:-18080}:8080"
      - "${NACOS_SERVER_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - ./logs/nacos:/home/nacos/logs
    restart: unless-stopped
