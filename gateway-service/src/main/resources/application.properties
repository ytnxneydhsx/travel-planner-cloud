spring.application.name=gateway-service

# Server
server.port=8080

# CORS
gateway.cors.allowed-origin-patterns[0]=${GATEWAY_ALLOWED_ORIGIN_PATTERN:http://localhost:3000}
gateway.cors.allowed-methods[0]=GET
gateway.cors.allowed-methods[1]=POST
gateway.cors.allowed-methods[2]=PUT
gateway.cors.allowed-methods[3]=DELETE
gateway.cors.allowed-methods[4]=OPTIONS
gateway.cors.allowed-headers[0]=*
gateway.cors.allow-credentials=false
gateway.cors.max-age-seconds=3600

# JWT
security.jwt.secret=${JWT_SECRET:replace-this-with-a-long-secret-key}
security.jwt.issuer=${JWT_ISSUER:user-service}

# Access control
gateway.access-control.whitelist-paths[0]=/users/login
gateway.access-control.whitelist-paths[1]=/users/register

# Header policy
gateway.header-policy.strip-request-headers[0]=X-User-Id

# Downstream services
user-service.base-url=${USER_SERVICE_BASE_URL:http://localhost:8082}
destination-service.base-url=${DESTINATION_SERVICE_BASE_URL:http://localhost:8081}
itinerary-service.base-url=${ITINERARY_SERVICE_BASE_URL:http://localhost:8083}

# Routes
spring.cloud.gateway.server.webflux.routes[0].id=user-service
spring.cloud.gateway.server.webflux.routes[0].uri=${user-service.base-url}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/users/**

spring.cloud.gateway.server.webflux.routes[1].id=destination-service
spring.cloud.gateway.server.webflux.routes[1].uri=${destination-service.base-url}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/destinations/**

spring.cloud.gateway.server.webflux.routes[2].id=itinerary-service
spring.cloud.gateway.server.webflux.routes[2].uri=${itinerary-service.base-url}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/itineraries/**
