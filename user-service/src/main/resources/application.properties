spring.application.name=user-service
spring.config.import=optional:classpath:common-web-logging.properties
spring.cloud.nacos.discovery.server-addr=${NACOS_SERVER_ADDR:127.0.0.1:8848}
spring.cloud.nacos.discovery.username=${NACOS_USERNAME:nacos}
spring.cloud.nacos.discovery.password=${NACOS_PASSWORD:nacos}

# Server
server.port=${SERVER_PORT:8082}

# Datasource
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/travel_user?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis
mybatis.type-aliases-package=org.example.userservice.entity
mybatis.configuration.map-underscore-to-camel-case=true

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JWT
jwt.secret=${JWT_SECRET:replace-this-with-a-long-secret-key}
jwt.issuer=${JWT_ISSUER:user-service}
jwt.expire-seconds=${JWT_EXPIRE_SECONDS:7200}
